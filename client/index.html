<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кто хочет стать миллионером?</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="welcome-container">
        <h1>Кто хочет стать миллионером?</h1>
        <div class="categories-container" id="categories">
            <!-- Категории будут загружены через JavaScript -->
        </div>
        <button id="start-game" class="start-button">Начать игру</button>
    </div>

    <!-- Аудиоэлементы -->
    <audio id="backgroundMusic" loop>
        <source src="music/background.mp3" type="audio/mpeg">
        Ваш браузер не поддерживает аудио.
    </audio>
    <audio id="clickSound" src="music/click.mp3" preload="auto"></audio>

    <script src="script.js"></script>
    <script src="music-control.js"></script>

    <script>
        // Обработка звука клика
        document.addEventListener('DOMContentLoaded', function () {
            const clickSound = document.getElementById('clickSound');
            clickSound.volume = 0.5; // Громкость 50%

            // Обработка кнопки "Начать игру"
            document.getElementById('start-game').addEventListener('click', function () {
                clickSound.currentTime = 0;
                clickSound.play().catch(e => console.log("Не удалось воспроизвести звук"));
            });

            // Обработка будущих кнопок категорий
            document.getElementById('categories').addEventListener('click', function (e) {
                if (e.target.tagName === 'BUTTON') {
                    clickSound.currentTime = 0;
                    clickSound.play().catch(e => console.log("Не удалось воспроизвести звук"));
                }
            });
        });
    </script>
</body>

</html>
